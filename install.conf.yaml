- defaults:
    link:
      create: true
      relink: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ['~']

- link:
    ~/.tmux.conf: tmux/tmux.conf
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.wezterm.lua: wezterm/wezterm.lua
    ~/.config/ghostty/config: ghostty/config
    ~/.config/git/config: git/config
    ~/.config/nvim/init.lua: nvim/init.lua
    ~/.config/nvim/lua: nvim/lua
    ~/.config/k9s/views.yaml: k9s/views.yaml
    ~/.config/hypr/hyprland.lua: hypr/hyprland.lua
    ~/.config/hypr/hyprlock.conf: hypr/hyprlock.conf
    ~/.config/hypr/hyprlock.png: hypr/hyprlock.png
    ~/.config/hypr/hyprpaper.conf: hypr/hyprpaper.conf
    ~/.config/waybar/config: waybar/config
    ~/.config/waybar/style.css: waybar/style.css
    ~/.config/dunst/dunstrc: dunst/dunstrc
    ~/.config/i3/config:
      if: "[ $(uname) = Linux ]"
      path: i3/config
      force: true
    ~/.config/rofi:
      if: "[ $(uname) = Linux ]"
      path: rofi

- shell:
    - command: bash bootstrap/10-homebrew.sh
      description: Homebrew (macOS)
    - command: bash bootstrap/20-packages.sh
      description: System packages
    - command: bash bootstrap/30-starship.sh
      description: Starship
    - command: bash bootstrap/40-rust.sh
      description: Rust + cargo packages
    - command: bash bootstrap/50-pipx.sh
      description: pipx packages
    - command: bash bootstrap/60-node.sh
      description: yarn + global packages
    - command: bash bootstrap/70-plugins.sh
      description: tmux/zsh plugins
    - command: bash bootstrap/80-fonts.sh
      description: Fonts
    - command: bash bootstrap/90-shell.sh
      description: Login shell
